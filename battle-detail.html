<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Dossier — March of Empire</title>
<meta name="description" content="In-depth military dossier, order of battle, tactical progression, commanders, casualties, and historical outcome.">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
.battle-hero-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 2rem;
  align-items: start;
}
.quick-facts-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1.5rem;
}
.fact-row {
  display: flex;
  justify-content: space-between;
  padding: .65rem 0;
  border-bottom: 1px solid var(--border);
  font-size: .88rem;
}
.fact-row:last-child { border-bottom: none; }
.fact-label { color: var(--steel); font-family: var(--font-mono); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.fact-val { font-weight: 600; text-align: right; color: var(--fg); }

.oob-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-top: 1.5rem;
}
.oob-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-top: 4px solid var(--border-light);
  border-radius: 4px;
  padding: 1.5rem;
}
.casualty-box {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}
.casualty-item {
  background: rgba(0,0,0,0.25);
  border-left: 3px solid var(--signal-red);
  padding: .85rem 1rem;
  border-radius: 0 4px 4px 0;
}
.casualty-num {
  font-family: var(--font-mono);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--fg);
}
.casualty-lbl {
  font-size: .76rem;
  color: var(--steel);
  margin-top: .2rem;
}

.map-schematic-wrap {
  border: 1px solid var(--border);
  background: #0d1117;
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}
.map-canvas-container {
  height: 240px;
  position: relative;
}

@media(max-width: 900px) {
  .battle-hero-grid { grid-template-columns: 1fr; }
  .oob-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="chrome-top"></div>

<main id="main">
  <div id="battleContent">
    <!-- Populated by JS -->
    <section class="page-hero">
      <div class="container">
        <p style="color:var(--steel); font-family:var(--font-mono);">Loading engagement dossier…</p>
      </div>
    </section>
  </div>
</main>

<div id="chrome-footer"></div>

<script src="js/data-battles.js"></script>
<script src="js/data-operations.js"></script>
<script src="js/data-leaders.js"></script>
<script src="js/data-weapons.js"></script>
<script src="js/data-countries.js"></script>
<script src="js/data-timeline.js"></script>
<script src="js/data-resources.js"></script>
<script src="js/data-forts.js"></script>
<script src="js/data-maps.js"></script>
<script src="js/chrome.js"></script>
<script>
document.addEventListener('chrome:ready', () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const battle = (typeof BATTLES !== 'undefined') ? BATTLES.find(b => b.id === id) : null;
  const container = document.getElementById('battleContent');

  if (!battle) {
    // Show catalog if no valid ID
    document.title = "Battle Dossiers — March of Empire";
    container.innerHTML = `
      <section class="page-hero">
        <div class="container">
          <div class="breadcrumb"><a href="index.html">Home</a> / <a href="battles.html">Battles</a> / Dossiers</div>
          <span class="eyebrow">Tactical Archives</span>
          <h1 class="display">Battlefield Dossiers</h1>
          <p>Select any historic engagement across eras to inspect complete orders of battle, casualty reports, tactical progression, and commander dispositions.</p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <h2 style="font-size:1.3rem; margin-bottom:1.5rem; text-transform:uppercase; letter-spacing:0.06em;">Featured Engagements</h2>
          <div class="grid grid-3">
            ${(typeof BATTLES !== 'undefined' ? BATTLES.filter(b => b.tier === 'featured').slice(0, 15) : []).map(b => `
              <a href="battle-detail.html?id=${b.id}" class="card" style="text-decoration:none; display:block; padding:1.2rem; border-left:3px solid ${THEATRE_COLORS[b.theatre] || 'var(--brass)'}; transition:all .2s;">
                <span style="font-size:.72rem; color:var(--brass); font-family:var(--font-mono); text-transform:uppercase;">${b.dates} &middot; ${b.year < 0 ? Math.abs(b.year)+' BCE' : b.year}</span>
                <h3 style="font-size:1.05rem; margin:.4rem 0 .2rem;">${b.name}</h3>
                <p style="font-size:.82rem; color:var(--steel); margin:0;">${b.location}</p>
              </a>
            `).join('')}
          </div>
          <div style="margin-top:2rem; text-align:center;">
            <a href="battles.html" class="btn btn-outline-dark">Browse All 100+ Battles</a>
          </div>
        </div>
      </section>
    `;
    return;
  }

  // Update Page Title
  document.title = `${battle.name} — Battle Dossier | March of Empire`;

  // Determine era and theme color
  let eraName = "World War II";
  let eraColor = "var(--signal-red)";
  let eraBadgeClass = "tag-red";
  if (battle.era === 'ancient' || battle.theatre === 'ancient') {
    eraName = "Ancient & Classical";
    eraColor = "#8B6914";
    eraBadgeClass = "tag-brass";
  } else if (battle.era === 'maratha' || battle.theatre === 'maratha') {
    eraName = "Maratha Empire";
    eraColor = "#CD7F32";
    eraBadgeClass = "tag-brass";
  } else if (battle.era === 'napoleonic' || battle.theatre === 'napoleonic') {
    eraName = "Napoleonic Era";
    eraColor = "#4A6741";
    eraBadgeClass = "tag-brass";
  } else if (battle.era === 'wwi' || battle.theatre === 'wwi') {
    eraName = "World War I";
    eraColor = "#6B5B45";
    eraBadgeClass = "tag-steel";
  }

  const theatreName = THEATRE_LABELS[battle.theatre] || eraName;
  const mapColor = THEATRE_COLORS[battle.theatre] || eraColor;

  // Commanders and forces extraction
  const side1 = battle.side1 || battle.allied || { label: "Combatant A", forces: "Forces detailed in record" };
  const side2 = battle.side2 || battle.axis || { label: "Combatant B", forces: "Forces detailed in record" };
  const cmdr1 = battle.commanders ? (battle.commanders.side1 || battle.commanders.allied || "Not recorded") : "Not recorded";
  const cmdr2 = battle.commanders ? (battle.commanders.side2 || battle.commanders.axis || "Not recorded") : "Not recorded";

  // Check matching commanders in data-leaders.js
  let cmdr1Link = "";
  let cmdr2Link = "";
  if (typeof LEADERS !== 'undefined') {
    const l1 = LEADERS.find(l => cmdr1.toLowerCase().includes(l.name.toLowerCase()) || cmdr1.toLowerCase().includes(l.id));
    if (l1) cmdr1Link = `<a href="commander-detail.html?id=${l1.id}" style="color:var(--brass); text-decoration:underline; font-size:.84rem; display:inline-block; margin-top:.3rem;">View Commander Dossier (${l1.name}) &rarr;</a>`;
    const l2 = LEADERS.find(l => cmdr2.toLowerCase().includes(l.name.toLowerCase()) || cmdr2.toLowerCase().includes(l.id));
    if (l2) cmdr2Link = `<a href="commander-detail.html?id=${l2.id}" style="color:var(--brass); text-decoration:underline; font-size:.84rem; display:inline-block; margin-top:.3rem;">View Commander Dossier (${l2.name}) &rarr;</a>`;
  }

  // Related battles
  let relatedHtml = "";
  if (battle.related && battle.related.length && typeof BATTLES !== 'undefined') {
    const relItems = battle.related.map(rid => BATTLES.find(b => b.id === rid)).filter(Boolean);
    if (relItems.length) {
      relatedHtml = `
        <div style="margin-top:2.5rem;">
          <h3 style="font-size:1.1rem; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:.5rem;">Related Engagements</h3>
          <div class="grid grid-3">
            ${relItems.map(rb => `
              <a href="battle-detail.html?id=${rb.id}" class="card" style="text-decoration:none; padding:1rem; border-left:3px solid ${THEATRE_COLORS[rb.theatre] || 'var(--brass)'};">
                <span style="font-size:.72rem; color:var(--steel); font-family:var(--font-mono);">${rb.dates}</span>
                <h4 style="font-size:.95rem; margin:.3rem 0 .2rem; color:var(--fg);">${rb.name}</h4>
                <p style="font-size:.78rem; color:var(--steel); margin:0;">${rb.location}</p>
              </a>
            `).join('')}
          </div>
        </div>
      `;
    }
  }

  container.innerHTML = `
    <!-- HERO SECTION -->
    <section class="page-hero" style="border-bottom:1px solid var(--border); padding-bottom:2.5rem;">
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html">Home</a> / <a href="battles.html">Battles</a> / ${battle.name}
        </div>
        <div style="display:flex; gap:.6rem; align-items:center; margin-bottom:.7rem; flex-wrap:wrap;">
          <span class="tag ${eraBadgeClass}" style="font-size:.75rem;">${eraName}</span>
          <span class="tag tag-steel" style="font-size:.75rem;">${theatreName}</span>
          ${battle.conflict ? `<span class="tag" style="background:rgba(255,255,255,0.06); color:var(--sand); font-size:.75rem;">${battle.conflict}</span>` : ''}
        </div>
        <h1 class="display" style="font-size:clamp(2rem, 4vw, 3rem); margin-bottom:.6rem;">${battle.name}</h1>
        <p class="lede" style="max-width:820px; color:var(--sand);">${battle.significance || battle.summary || 'Strategic engagement shaping historical empire territorial boundaries.'}</p>
      </div>
    </section>

    <!-- MAIN DOSSIER BODY -->
    <section class="section" style="padding-top:2rem;">
      <div class="container">
        <div class="battle-hero-grid">
          <!-- LEFT COLUMN: DEEP DIVE -->
          <div>
            <!-- TACTICAL OVERVIEW -->
            <div class="card" style="padding:1.8rem; margin-bottom:2rem;">
              <h2 style="font-size:1.3rem; margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:.5rem;">
                Historical Context &amp; Strategic Engagement
              </h2>
              <p style="font-size:1rem; line-height:1.7; color:var(--sand); margin-bottom:1.4rem;">
                ${battle.outcome || battle.summary || 'Historical records describe fierce combat across fortified lines, decisive tactical manoeuvres, and significant territorial realignments.'}
              </p>

              ${battle.summary && battle.outcome && battle.summary !== battle.outcome ? `
                <div style="background:rgba(0,0,0,0.2); border-left:3px solid var(--brass); padding:1rem 1.2rem; border-radius:0 4px 4px 0; margin-bottom:1.5rem;">
                  <span style="font-family:var(--font-mono); font-size:.74rem; text-transform:uppercase; color:var(--brass); letter-spacing:.08em; display:block; margin-bottom:.3rem;">Tactical Summary</span>
                  <p style="font-size:.9rem; color:var(--fg); margin:0; line-height:1.6;">${battle.summary}</p>
                </div>
              ` : ''}

              <!-- ORDER OF BATTLE -->
              <h3 style="font-size:1.15rem; margin-top:2rem; margin-bottom:.8rem; text-transform:uppercase; letter-spacing:.05em;">
                Opposing Forces &amp; Orders of Battle
              </h3>
              <div class="oob-grid">
                <!-- SIDE 1 -->
                <div class="oob-card" style="border-top-color:${eraColor};">
                  <span class="tag tag-brass" style="margin-bottom:.5rem; display:inline-block;">${side1.label}</span>
                  <h4 style="font-size:1.05rem; margin-bottom:.4rem;">${side1.label}</h4>
                  <p style="font-size:.86rem; color:var(--sand); margin-bottom:.8rem;">
                    <strong>Deployed Strength:</strong> ${side1.forces || 'Infantry, cavalry, and artillery units'}
                  </p>
                  <div style="font-size:.85rem; border-top:1px solid var(--border); padding-top:.6rem;">
                    <span style="color:var(--steel); font-family:var(--font-mono); font-size:.76rem; text-transform:uppercase; display:block;">Commanded by:</span>
                    <strong>${cmdr1}</strong>
                    ${cmdr1Link}
                  </div>
                </div>

                <!-- SIDE 2 -->
                <div class="oob-card" style="border-top-color:var(--steel);">
                  <span class="tag tag-steel" style="margin-bottom:.5rem; display:inline-block;">${side2.label}</span>
                  <h4 style="font-size:1.05rem; margin-bottom:.4rem;">${side2.label}</h4>
                  <p style="font-size:.86rem; color:var(--sand); margin-bottom:.8rem;">
                    <strong>Deployed Strength:</strong> ${side2.forces || 'Defensive garrisons and field battalions'}
                  </p>
                  <div style="font-size:.85rem; border-top:1px solid var(--border); padding-top:.6rem;">
                    <span style="color:var(--steel); font-family:var(--font-mono); font-size:.76rem; text-transform:uppercase; display:block;">Commanded by:</span>
                    <strong>${cmdr2}</strong>
                    ${cmdr2Link}
                  </div>
                </div>
              </div>

              <!-- CASUALTIES & TOLL -->
              <h3 style="font-size:1.15rem; margin-top:2.2rem; margin-bottom:.5rem; text-transform:uppercase; letter-spacing:.05em;">
                Casualties &amp; Human Cost
              </h3>
              <p style="font-size:.84rem; color:var(--steel);">Documented losses based on contemporary military dispatch records and academic consensus:</p>
              <div class="casualty-box">
                ${(battle.casualties && battle.casualties.length ? battle.casualties : [
                  { value: "Severe", label: "Frontline casualties and material losses" }
                ]).map(c => `
                  <div class="casualty-item">
                    <div class="casualty-num">${c.value}</div>
                    <div class="casualty-lbl">${c.label}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- RELATED ENGAGEMENTS -->
            ${relatedHtml}
          </div>

          <!-- RIGHT COLUMN: QUICK FACTS & SCHEMATIC -->
          <aside>
            <div class="quick-facts-card" style="margin-bottom:1.5rem;">
              <h3 style="font-size:1rem; text-transform:uppercase; letter-spacing:.08em; margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:.5rem;">
                Engagement Metrics
              </h3>
              <div class="fact-row">
                <span class="fact-label">Date</span>
                <span class="fact-val">${battle.dates}</span>
              </div>
              <div class="fact-row">
                <span class="fact-label">Historical Year</span>
                <span class="fact-val">${battle.year < 0 ? Math.abs(battle.year) + ' BCE' : battle.year + ' CE'}</span>
              </div>
              <div class="fact-row">
                <span class="fact-label">Location</span>
                <span class="fact-val">${battle.location}</span>
              </div>
              <div class="fact-row">
                <span class="fact-label">Theatre</span>
                <span class="fact-val">${theatreName}</span>
              </div>
              <div class="fact-row">
                <span class="fact-label">Era</span>
                <span class="fact-val">${eraName}</span>
              </div>
              <div class="fact-row">
                <span class="fact-label">Archive Tier</span>
                <span class="fact-val">${battle.tier === 'featured' ? 'Featured Engagement' : 'Standard Archive'}</span>
              </div>
            </div>

            <!-- TACTICAL MAP SCHEMATIC -->
            <div class="map-schematic-wrap" style="margin-bottom:1.5rem;">
              <div style="padding:.7rem 1rem; border-bottom:1px solid var(--border); background:var(--panel-raised); display:flex; justify-content:space-between; align-items:center;">
                <span style="font-family:var(--font-mono); font-size:.74rem; text-transform:uppercase; color:var(--sand); letter-spacing:.06em;">Tactical Schematic</span>
                <span style="font-size:.7rem; color:var(--steel);">Variant ${battle.mapVariant || 1}</span>
              </div>
              <div class="map-canvas-container" style="background:${mapColor}15; display:flex; align-items:center; justify-content:center;">
                ${typeof WW2 !== 'undefined' && WW2.tacticalMap ? WW2.tacticalMap(mapColor, battle.mapVariant || 1) : '<div style="color:var(--steel); font-family:var(--font-mono); font-size:.8rem;">Tactical Grid Activated</div>'}
              </div>
              <div style="padding:.75rem 1rem; font-size:.78rem; color:var(--steel); background:var(--panel);">
                <p style="margin:0;">Coordinates calibrated to ${battle.location}. Interactive geographical layer available in the <a href="maps.html" style="color:var(--brass); text-decoration:underline;">Battle Atlas</a>.</p>
              </div>
            </div>

            <!-- ACTION BUTTONS -->
            <div style="display:flex; flex-direction:column; gap:.7rem;">
              <a href="battles.html" class="btn btn-outline-dark" style="text-align:center; width:100%;">
                &larr; Back to Battles Archive
              </a>
              <a href="maps.html" class="btn btn-outline-dark" style="text-align:center; width:100%;">
                Explore on Interactive Atlas &rarr;
              </a>
            </div>
          </aside>
        </div>
      </div>
    </section>
  `;

  if (typeof WW2_UI !== 'undefined' && WW2_UI.initReveal) {
    WW2_UI.initReveal();
  }
});
</script>
</body>
</html>
